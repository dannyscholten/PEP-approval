name: Check and publish PEP
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pep-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Check curriculum rules and draft imports
        run: npm test
      - name: Build the website
        run: npm run build
      - name: Install test browser
        timeout-minutes: 5
        run: |
          # Avoid long retries against the intermittent Azure package mirror.
          if [ -f /etc/apt/apt-mirrors.txt ]; then
            sudo sed -i 's/azure.archive.ubuntu.com/archive.ubuntu.com/g' /etc/apt/apt-mirrors.txt
          fi
          printf 'Acquire::Retries "1";\nAcquire::http::Timeout "15";\nAcquire::https::Timeout "15";\n' | sudo tee /etc/apt/apt.conf.d/99-pep-ci-timeouts >/dev/null
          npx playwright install --with-deps chromium
      - name: Check form interactions, draft imports and PDF export
        run: npm run test:browser
      - name: Configure Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v5
      - name: Upload tested website
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist
  deploy:
    if: github.event_name != 'pull_request'
    needs: check-and-build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish the tested website
        id: deployment
        uses: actions/deploy-pages@v4
